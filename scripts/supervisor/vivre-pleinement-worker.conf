; Worker de file d'attente, sous Supervisor.
;
; Sans lui, un worker qui meurt laisse les paiements encaissés par Stripe sans
; effet côté application : le rendez-vous n'est jamais confirmé, l'inscription
; jamais activée, le livre jamais envoyé, et rien n'alerte. La page du client
; tourne indéfiniment sur « paiement reçu ». C'est le mode de panne le plus
; coûteux de cette application, et le plus discret.
;
; Installation, sur le serveur :
;   sudo cp vivre-pleinement-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status vivre-pleinement-worker:*
;
; APRÈS CHAQUE DÉPLOIEMENT, impérativement :
;   php artisan queue:restart
; Un worker charge le code une fois au démarrage et le garde en mémoire. Sans
; ce redémarrage il continue d'exécuter l'ancienne version, et les jobs
; « réussissent » sans rien faire.

[program:vivre-pleinement-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/vivre-pleinement
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000

; Un seul processus suffit largement au volume actuel. Les services de paiement
; verrouillent leurs lignes (lockForUpdate), donc monter numprocs reste sûr,
; mais rien ne le justifie aujourd'hui.
numprocs=1

user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3

; Doit dépasser la durée du job le plus long, sinon un arrêt propre coupe un
; traitement en cours. Les listeners Stripe rejouent jusqu'à 5 fois avec un
; palier maximal de 15 minutes entre tentatives.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

redirect_stderr=true
stdout_logfile=/var/www/vivre-pleinement/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
